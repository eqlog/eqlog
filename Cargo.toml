[workspace]
resolver = "2"

members = [
  "eqlog",
  "eqlog-runtime",
  "eqlog-ett",
  "eqlog-test-eval",
  "eqlog-test-compile",
  "eqlog-test-opt",
  "eqlog-bench",
  # "v1_to_v2",
  # "examples/inference",
]

# Standalone examples should build without a local eqlog checkout.
exclude = [
  "examples/semilattice",
  "cwf-theory",
  "exp-epa",
]

[workspace.package]
edition = "2021"
version = "0.10.0"
authors = [
  "Martin E. Bidlingmaier <martin.bidlingmaier@mbid.me>",
  "Jakob Botsch Nielsen <jakob.botsch.nielsen@gmail.com>",
]
license = "MIT"
description = "Datalog with equality"
repository = "https://github.com/eqlog/eqlog/"
readme = "README.md"

# Use optimization for build scripts; eqlog is very slow otherwise.
[profile.dev.build-override]
opt-level = 3
debug = false
[profile.release.build-override]
opt-level = 3
debug = false
