[package]
name = "eqlog-bench"
version = "0.1.0"
edition = "2021"
publish = false
autobenches = false

[features]
allocations = []

[dependencies]
clap = { version = "4", features = ["derive"] }
eqlog-runtime = { path = "../eqlog-runtime" }

[build-dependencies]
eqlog = { path = "../eqlog", features = ["rebuild"] }

[[bench]]
name = "member_mapping"
harness = false
