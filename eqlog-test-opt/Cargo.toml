[package]
name = "eqlog-test-opt"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
eqlog-runtime = { path = "../eqlog-runtime" }
rand = "=0.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
eqlog = { path = "../eqlog", features = ["rebuild"] }
indoc = ">= 0"
rand = "=0.10.1"
