[package]
name = "eqlog-test-eval"
version = "0.1.0"
edition = "2021"

[features]
naive = []
desugared = []
stratified = []

[dependencies]
eqlog-runtime = { path = "../eqlog-runtime" }
maplit = ">= 0"

[build-dependencies]
eqlog = { path = "../eqlog", features = ["rebuild"] }
env_logger = ">= 0"
indoc = "2"
log = ">= 0"

[dev-dependencies]
eqlog-ett = { path = "../examples/ett" }
indoc = "2"
